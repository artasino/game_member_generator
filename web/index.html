<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Game Member Generator">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Game Member">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="app-icon.png">
  <link rel="icon" href="app-icon.png">

  <title>Game Member Generator</title>
  <style>
    #sw-update-toast,
    #offline-ready {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: 92vw;
      background: rgba(32, 33, 36, 0.96);
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      font-size: 14px;
      line-height: 1.4;
      display: none;
      align-items: center;
      gap: 10px;
    }

    #sw-update-toast button {
      border: none;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #sw-reload-btn {
      background: #4fc3f7;
      color: #111;
    }

    #sw-later-btn {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div id="offline-ready" role="status" aria-live="polite">オフラインで使う準備ができました。</div>
  <div id="sw-update-toast" role="status" aria-live="polite">
    <span>新しいバージョンがあります。更新しますか？</span>
    <button id="sw-reload-btn" type="button">更新する</button>
    <button id="sw-later-btn" type="button">あとで</button>
  </div>

  <script>
    (() => {
      if (!('serviceWorker' in navigator)) return;

      const serviceWorker = navigator.serviceWorker;
      const workerUrl = new URL('offline_service_worker.js', document.baseURI);
      const toast = document.getElementById('sw-update-toast');
      const offlineReady = document.getElementById('offline-ready');
      let previousController = serviceWorker.controller;
      let waitingWorker = null;

      function showReady() {
        const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
        const key = standalone ? 'gmg-offline-ready-standalone' : 'gmg-offline-ready';
        if (sessionStorage.getItem(key)) return;
        sessionStorage.setItem(key, 'true');
        offlineReady.style.display = 'flex';
        setTimeout(() => { offlineReady.style.display = 'none'; }, 6000);
      }

      function showUpdate(registration) {
        if (!serviceWorker.controller || !registration.waiting) return;
        offlineReady.style.display = 'none';
        waitingWorker = registration.waiting;
        toast.style.display = 'flex';
      }

      function watchInstall(registration) {
        const worker = registration.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => showUpdate(registration));
      }

      document.getElementById('sw-reload-btn').addEventListener('click', () => {
        waitingWorker?.postMessage('skipWaiting');
        toast.style.display = 'none';
      });

      document.getElementById('sw-later-btn').addEventListener('click', () => {
        toast.style.display = 'none';
      });

      serviceWorker.addEventListener('controllerchange', () => {
        const controller = serviceWorker.controller;
        if (controller?.scriptURL !== workerUrl.href) return;
        if (previousController) {
          window.location.reload();
          return;
        }
        previousController = controller;
        showReady();
      });

      window.addEventListener('load', async () => {
        try {
          const registration = await serviceWorker.register(workerUrl.href, {
            updateViaCache: 'none',
          });
          if (navigator.onLine && serviceWorker.controller?.scriptURL === workerUrl.href &&
              !registration.waiting) showReady();
          showUpdate(registration);
          watchInstall(registration);
          registration.addEventListener('updatefound', () => watchInstall(registration));
          const checkForUpdate = () => {
            if (navigator.onLine && document.visibilityState === 'visible') {
              registration.update().catch(() => {});
            }
          };
          document.addEventListener('visibilitychange', checkForUpdate);
          window.addEventListener('online', checkForUpdate);
          setInterval(checkForUpdate, 60000);
        } catch (error) {
          console.debug('Offline preparation unavailable:', error);
        }
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
