name: Build and Deploy

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.VERSION }}
      build_number: ${{ steps.vars.outputs.BUILD_NUMBER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version info
        id: vars
        run: |
          # 最新のタグ (v1.1.0等) を取得。タグがない場合は 0.0.0 を使用
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RAW_LATEST_TAG="$GITHUB_REF_NAME"
          else
            RAW_LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          fi
          LATEST_TAG=${RAW_LATEST_TAG#v}
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.0"
          fi

          # タグビルドは常に 0、ブランチビルドは直近タグからのコミット数を採用
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_NUMBER=0
          elif [ -n "$RAW_LATEST_TAG" ]; then
            BUILD_NUMBER=$(git rev-list --count "${RAW_LATEST_TAG}..HEAD")
          else
            BUILD_NUMBER=$(git rev-list --count HEAD)
          fi

          echo "VERSION=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Using version: $LATEST_TAG"
          echo "Using build number: $BUILD_NUMBER"

  deploy-web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web (release)
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          APP_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          BUILD_DATE=$(TZ=Asia/Tokyo date +'%Y/%m/%d')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 .github/scripts/prepare_web_changelog.py "$APP_VERSION" "$BUILD_DATE"
          fi
          flutter build web --release --pwa-strategy=none \
            --build-name="$APP_VERSION" \
            --build-number="$APP_BUILD_NUMBER" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=APP_BUILD_NUMBER="$APP_BUILD_NUMBER" \
            --dart-define=BUILD_DATE="$BUILD_DATE" \
            --dart-define=OFFLINE_WEB_FONT=true
          python3 .github/scripts/prepare_web_offline.py

      - name: Authenticate to Google Cloud
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GAME_MEMBER_GENERATOR }}'

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        run: npx firebase-tools deploy --only hosting --project game-member-generator

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows build
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: |
          $BUILD_DATE = Get-Date -Format "yyyy/MM/dd"
          flutter build windows --release `
            --build-name=${{ needs.version.outputs.version }} `
            --build-number=${{ needs.version.outputs.build_number }} `
            --dart-define=BUILD_DATE=$BUILD_DATE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game_member_generator_windows
          path: build/windows/x64/runner/Release

      - name: Zip build
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir release
          xcopy build\windows\x64\runner\Release\* release\ /E /I
          Compress-Archive -Path release\* -DestinationPath game_member_generator_windows.zip

      - name: Upload Windows ZIP to the published release
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" game_member_generator_windows.zip --clobber
